name: Build & Release

on:
  push:
    tags:
      - 'v*'               # Triggers on tags like v1.0.0, v2.1.0, etc.

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # We'll handle each platform separately to control the build matrix
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows-x86_64
          - os: windows-latest
            target: i686-pc-windows-msvc
            artifact_name: windows-i686
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: macos-intel
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          target: ${{ matrix.target }}

      - name: Install cross‑compilation dependencies (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      # For Windows 32-bit, we need to install the MSVC build tools (already present)
      # No extra steps needed.

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Install Tauri CLI (if not present)
        run: cargo install tauri-cli || echo "Already installed"

      - name: Build for ${{ matrix.target }}
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
